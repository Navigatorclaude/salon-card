<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="沙龙手卡">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f3ec">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-512.png">
<title>沙龙电子手卡</title>
<style>
:root{
  --bg:#f6f3ec;--card:#fffdf8;--ink:#1d2333;--mute:#6b7080;--line:#e6e0d3;--soft:#efe9dc;
  --A:#d9542b;--Abg:#fdeee7;--B:#11806f;--Bbg:#e3f3ef;
  --warn:#e9a400;--warnbg:#fff4d6;--bad:#d23a3a;--badbg:#fde6e6;--ok:#2f8f4e;--info:#2f5fd0;--infobg:#e7eefc;
  --hole:#fff1b8;--holeink:#7a5a00;--fs:1;
  --shadow:0 1px 2px rgba(30,30,50,.06),0 4px 14px rgba(30,30,50,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141b;--card:#1b1e28;--ink:#eceef4;--mute:#9aa0b0;--line:#2b2f3c;--soft:#232735;
  --A:#ff8a5f;--Abg:#3a2219;--B:#4fd1bb;--Bbg:#15332e;--warn:#ffc531;--warnbg:#3a2f0e;--bad:#ff6b6b;--badbg:#3d1a1a;--ok:#5fd18a;--info:#7ea2ff;--infobg:#1b2440;
  --hole:#4a3d0f;--holeink:#ffe08a;--shadow:none;}}
:root[data-theme="dark"]{
  --bg:#12141b;--card:#1b1e28;--ink:#eceef4;--mute:#9aa0b0;--line:#2b2f3c;--soft:#232735;
  --A:#ff8a5f;--Abg:#3a2219;--B:#4fd1bb;--Bbg:#15332e;--warn:#ffc531;--warnbg:#3a2f0e;--bad:#ff6b6b;--badbg:#3d1a1a;--ok:#5fd18a;--info:#7ea2ff;--infobg:#1b2440;
  --hole:#4a3d0f;--holeink:#ffe08a;--shadow:none;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;}
body{font-size:calc(16px*var(--fs));line-height:1.6;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;border-bottom:1px solid var(--line)}
#top .row{display:flex;align-items:center;gap:10px}
#clock{font-size:calc(30px*var(--fs));font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px}
#clock small{font-size:.45em;color:var(--mute);font-weight:600;margin-left:6px}
#nowmini{flex:1;min-width:0;font-size:.85em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{padding:4px 10px;border-radius:99px;font-weight:700;font-size:.8em;white-space:nowrap}
.role.A{background:var(--Abg);color:var(--A)} .role.B{background:var(--Bbg);color:var(--B)}
#reh{display:none;margin-top:6px;background:var(--infobg);color:var(--info);border-radius:8px;padding:4px 10px;font-size:.8em;font-weight:600}
main{padding:12px 16px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mute);font-weight:600}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--ink)} nav button.on svg{stroke:var(--A)}
nav button.emg.on svg,nav button.emg svg{stroke:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h2{font-size:1.15em;margin:0 0 4px} .card h3{font-size:1em;margin:10px 0 4px}
.k{font-size:.8em;color:var(--mute);font-weight:600}
.big{font-size:calc(40px*var(--fs));font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.bar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;background:var(--A);border-radius:9px}
.blk{border-left:4px solid var(--line);padding:6px 0 6px 12px;margin:10px 0}
.blk.say{border-color:var(--A)} .blk.do{border-color:var(--mute)} .blk.tip{border-color:var(--warn)}
.blk .lab{font-size:.78em;font-weight:700;color:var(--mute);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.blk.say .txt{font-size:1.12em;font-weight:500;white-space:pre-line}
.blk.do .txt,.blk.tip .txt{white-space:pre-line}
.blk.past{opacity:.45}
.at{background:var(--soft);border-radius:6px;padding:0 6px;font-variant-numeric:tabular-nums;color:var(--ink)}
.hole{background:var(--hole);color:var(--holeink);border-radius:4px;padding:0 3px;font-weight:600}
.fill{font-weight:700}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.75em;font-weight:700}
.chip.A{background:var(--Abg);color:var(--A)} .chip.B{background:var(--Bbg);color:var(--B)} .chip.AB{background:var(--soft);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;font-weight:700;background:var(--soft);min-height:48px}
.btn.pri{background:var(--A);color:#fff} .btn.b{background:var(--B);color:#fff} .btn.bad{background:var(--bad);color:#fff}
.btn.full{width:100%} .btns{display:flex;gap:8px;flex-wrap:wrap} .btns .btn{flex:1}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:700;font-size:.85em;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.flow{position:relative}
.fitem{scroll-margin-top:110px;display:flex;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:8px}
.fitem.cur{border:2px solid var(--A);background:var(--Abg)}
.fitem.done{opacity:.55}
.fitem .tm{font-variant-numeric:tabular-nums;font-weight:800;min-width:52px}
.fitem .tm small{display:block;font-weight:600;color:var(--mute);font-size:.75em}
.fitem .ti{flex:1;min-width:0} .fitem .ti b{display:block}
.kind{font-size:.72em;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--mute);margin-left:4px}
.detail{display:none;margin:-4px 0 10px;padding:4px 12px 8px;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:var(--card)}
.detail.open{display:block}
.side{margin-top:6px;padding:8px 10px;border-radius:10px}
.side.A{background:var(--Abg)} .side.B{background:var(--Bbg)}
.side>.k{display:block;margin-bottom:2px}
.cue{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.cue:first-of-type{border-top:0}
.cue .when{font-weight:800;font-variant-numeric:tabular-nums;min-width:50px}
.cue .cd{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--mute);font-weight:700;white-space:nowrap}
.cue.soon .cd{color:var(--bad)}
.timer{text-align:center;padding:18px 10px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:12px}
.timer .t{font-size:calc(84px*var(--fs));font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.timer.warn{background:var(--warnbg);border-color:var(--warn)} .timer.warn .t{color:var(--warn)}
.timer.bad{background:var(--badbg);border-color:var(--bad)} .timer.bad .t{color:var(--bad)}
.timer .who{font-size:1.4em;font-weight:800;margin-bottom:4px}
.timer .msg{font-size:1.05em;font-weight:700;min-height:1.6em;margin-top:6px}
.roster{list-style:none;padding:0;margin:0}
.roster li{display:flex;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.roster li .n{width:26px;height:26px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:.8em;font-weight:700;flex:none}
.roster li.cur{background:var(--Abg);border-radius:10px} .roster li.cur .n{background:var(--A);color:#fff}
.roster li.done{color:var(--mute);text-decoration:line-through}
.roster li.skip{color:var(--warn)}
.roster li .x{margin-left:auto;font-size:.78em;color:var(--mute);padding:6px 8px;border-radius:8px;background:var(--soft)}
.signs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.signs button{padding:16px 6px;border-radius:12px;font-weight:800;font-size:1em;min-height:64px}
.s-warn{background:var(--warnbg);color:var(--warn)} .s-bad{background:var(--badbg);color:var(--bad)} .s-info{background:var(--infobg);color:var(--info)} .s-ok{background:var(--Bbg);color:var(--B)}
#ov{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff}
#ov.on{display:flex}
#ov .o1{font-size:min(22vw,22vh);font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;word-break:keep-all}
#ov .o2{font-size:min(7vw,6vh);font-weight:700;margin-top:16px;opacity:.95}
#ov .o3{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));font-size:14px;opacity:.75}
.ov-warn{background:#e39b00} .ov-bad{background:#cf2f2f} .ov-info{background:#2f5fd0} .ov-ok{background:#11806f} .ov-dark{background:#111}
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 70px);z-index:90;display:none;background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.25);font-weight:700}
#toast.on{display:block} #toast small{display:block;font-weight:500;opacity:.8}
.emg{margin-bottom:8px}
.emg>button{width:100%;text-align:left;padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:8px}
.emg>button::after{content:"＋";margin-left:auto;color:var(--mute)}
.emg.open>button{border-color:var(--bad);border-radius:12px 12px 0 0} .emg.open>button::after{content:"－"}
.emg .body{display:none;border:1px solid var(--bad);border-top:0;border-radius:0 0 12px 12px;padding:4px 14px 12px;background:var(--card)}
.emg.open .body{display:block}
.emg .say{background:var(--Abg);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:1.08em;font-weight:600}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.chk input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--B)}
.chk.done span.tx{color:var(--mute);text-decoration:line-through}
.field{margin-bottom:10px} .field label{display:block;font-size:.82em;font-weight:700;color:var(--mute);margin-bottom:3px}
.field input,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.field textarea{min-height:64px;resize:vertical}
.field .hint{font-size:.78em;color:var(--mute);margin-top:2px}
.warnline{color:var(--bad);font-size:.82em;font-weight:700}
.okline{color:var(--ok);font-size:.82em;font-weight:700}
.muted{color:var(--mute)} .small{font-size:.85em}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.empty{padding:20px;text-align:center;color:var(--mute)}
.tpl{background:var(--soft);border-radius:10px;padding:10px 12px;font-weight:600}
/* 打印版 */
.print{max-width:none;padding:0}
@page{size:A4;margin:14mm 13mm 14mm}
@media print{html,body{background:#fff!important} nav,#top,#toast,#ov{display:none!important} body{font-size:10.5pt;color:#111} main{padding:0}
  .card{box-shadow:none;break-inside:avoid-page} .noprint{display:none!important}}
.p-h1{font-size:22pt;font-weight:900;margin:0 0 2px}
.p-sub{color:#555;margin-bottom:10px}
.p-seg{border-top:2px solid #222;padding-top:6px;margin-top:14px;break-inside:auto}
.p-seg h2{break-after:avoid;font-size:13.5pt;margin:0 0 4px;display:flex;gap:10px;align-items:baseline}
.p-seg h2 .tm{font-variant-numeric:tabular-nums;min-width:96px}
.p-say{margin:6px 0;padding:6px 10px;border-left:4px solid #d9542b;background:#fdf3ee;break-inside:avoid;white-space:pre-line}
.p-say .lab,.p-do .lab{font-size:8.5pt;color:#777;font-weight:700;display:block}
.p-do{margin:4px 0;padding:2px 10px;border-left:4px solid #bbb;break-inside:avoid;white-space:pre-line}
.p-tip{margin:4px 0;padding:2px 10px;border-left:4px solid #e9a400;break-inside:avoid}
.p-b{margin:6px 0 0;padding:6px 10px;background:#e8f4f1;border-radius:6px;font-size:9.5pt;break-inside:avoid}
.p-b b{color:#11806f}
.p-tbl{width:100%;border-collapse:collapse;font-size:9.5pt;margin:6px 0}
.p-tbl th,.p-tbl td{border:1px solid #bbb;padding:5px 7px;vertical-align:top;text-align:left}
.p-tbl th{background:#f0ece2}
.p-tbl td.tm{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.p-h2{break-after:avoid;font-size:15pt;font-weight:900;margin:18px 0 6px;border-bottom:2px solid #222;padding-bottom:3px}
.p-box{border:1px solid #bbb;border-radius:8px;padding:8px 12px;margin:6px 0;break-inside:avoid}
.p-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p-cols>div{border:1px solid #ccc;border-radius:8px;padding:6px 10px;break-inside:avoid}
.p-cols h4{margin:2px 0 4px}
.p-cols ul{margin:0;padding-left:1.1em} .p-cols li{margin:2px 0}
.pb{break-before:page}
.bingo{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid #222;margin:6px 0 4px}
.bingo div{border:1px solid #222;height:31mm;padding:6px;font-weight:700;font-size:11pt;display:flex;flex-direction:column;justify-content:space-between}
.bingo div span{font-size:8pt;color:#888;font-weight:500;border-top:1px dashed #aaa;padding-top:2px}

/* 物料包（彩色打印） */
@page land{size:A4 landscape;margin:0}
@page port{size:A4 portrait;margin:0}
body.kit{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fff;color:#1d2333}
body.kit main{padding:0;max-width:none}
.kp,.kl{position:relative;overflow:hidden;break-after:page;background:#fff}
.kp{page:port;width:210mm;height:297mm}
.kl{page:land;width:297mm;height:210mm}
.kp:last-child,.kl:last-child{break-after:auto}
.k-foot{position:absolute;left:0;right:0;bottom:7mm;text-align:center;font-size:9pt;color:#9aa0b0}
.k-region{position:absolute;inset:10mm;border-radius:8mm;border:3mm solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.k-region .tag{position:absolute;top:0;left:0;right:0;background:var(--c);color:#fff;font-size:17pt;font-weight:800;padding:4mm 0;letter-spacing:2px}
.k-region .big{font-size:118pt;font-weight:900;color:var(--c);line-height:1.05;letter-spacing:4px}
.k-region .big.long{font-size:84pt}
.k-region .sub{font-size:20pt;color:#444;margin-top:6mm;font-weight:600}
.k-region .bot{position:absolute;bottom:5mm;font-size:12pt;color:#777}
.k-sign{position:absolute;inset:10mm;border-radius:8mm;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.k-sign .big{font-size:150pt;font-weight:900;line-height:1.05;letter-spacing:6px}
.k-sign .big.mid{font-size:112pt}
.k-sign .sub{font-size:22pt;font-weight:700;opacity:.92;margin-top:6mm}
.k-way{position:absolute;inset:10mm;border-radius:8mm;border:3mm solid #1d2333;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.k-way .big{font-size:120pt;font-weight:900;line-height:1.05;letter-spacing:6px;color:#1d2333}
.k-way .sub{font-size:22pt;color:#E8613C;font-weight:800;margin-top:6mm}
.k-way .ev{position:absolute;top:8mm;font-size:15pt;color:#777;font-weight:700;letter-spacing:2px}
.k-tags{position:absolute;left:15mm;top:13.5mm;display:grid;grid-template-columns:90mm 90mm;grid-auto-rows:54mm}
.k-tag{box-sizing:border-box;border:.3mm dashed #b9bdc8;position:relative;overflow:hidden;display:flex}
.k-tag .tb{width:15mm;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:none}
.k-tag .tb b{font-size:26pt;line-height:1}
.k-tag .tb span{font-size:6.5pt;margin-top:1.5mm;font-weight:700;line-height:1.2}
.k-tag .body{flex:1;padding:3mm 4mm 2.5mm;display:flex;flex-direction:column}
.k-tag .ev{font-size:6.5pt;color:#888;font-weight:700;letter-spacing:.5px;display:flex;justify-content:space-between}
.k-tag .egg{font-size:7pt;color:var(--c);font-weight:800;margin-top:.8mm}
.k-tag .ln{border-bottom:.35mm solid #c7cbd4;font-size:7pt;color:#9aa0b0;padding-top:2.2mm;display:flex;align-items:flex-end}
.k-tag .ln.name{flex:1.6;font-size:7.5pt}
.k-tag .ln{flex:1}
.k-head{padding:14mm 15mm 0}
.k-h1{font-size:24pt;font-weight:900;margin:0}
.k-sub{color:#6b7080;font-size:10.5pt;margin-top:1mm}
.k-tbl{width:100%;border-collapse:collapse;font-size:9.5pt;margin-top:4mm}
.k-tbl th,.k-tbl td{border:.3mm solid #c7cbd4;padding:2mm 2.5mm;text-align:left;vertical-align:top}
.k-tbl th{background:#f3efe5}
.k-note{border-radius:3mm;background:#fdeee7;padding:3mm 4mm;margin-top:4mm;font-size:10pt}
.k-note b{color:#d9542b}
.k-sheet{width:100%;border-collapse:collapse;font-size:10pt;margin-top:3mm}
.k-sheet th,.k-sheet td{border:.3mm solid #8a90a0;height:9mm;padding:0 2mm}
.k-sheet th{background:#1d2333;color:#fff;font-weight:700;height:9mm}
.k-sheet td.n{text-align:center;color:#888;width:9mm}
.k-sheet td.c{text-align:center;color:#c7cbd4;font-size:13pt;width:16mm}
.k-tent{position:absolute;inset:0}
.k-tent .half{position:absolute;left:12mm;right:12mm;height:93mm;display:flex;flex-direction:column;justify-content:center;padding:0 10mm}
.k-tent .half.top{top:6mm;transform:rotate(180deg)}
.k-tent .half.bot{bottom:6mm}
.k-tent .fold{position:absolute;left:0;right:0;top:105mm;border-top:.4mm dashed #b9bdc8}
.k-tent .fold span{position:absolute;right:6mm;top:-3.5mm;background:#fff;font-size:8pt;color:#9aa0b0;padding:0 2mm}
.k-tent h2{font-size:38pt;margin:0 0 3mm;color:#E8613C}
.k-tent p{font-size:19pt;margin:0;line-height:1.55;font-weight:600}
.k-tent .s{font-size:12.5pt;color:#555;margin-top:3mm;font-weight:500}
.k-pocket{position:absolute;inset:0;display:grid;grid-template-columns:105mm 105mm;grid-template-rows:148.5mm 148.5mm}
.k-pc{box-sizing:border-box;border:.3mm dashed #b9bdc8;padding:7mm 7mm 5mm;font-size:8.3pt;line-height:1.45;overflow:hidden}
.k-pc h3{font-size:12.5pt;margin:0 0 2mm;color:#E8613C}
.k-pc .r{display:flex;gap:2mm;border-bottom:.2mm solid #eee;padding:.7mm 0}
.k-pc .r b{min-width:11mm;font-variant-numeric:tabular-nums}
.k-pc .q{background:#fdeee7;border-radius:1.5mm;padding:1.4mm 2mm;margin:1.4mm 0}
.k-pc .q i{font-style:normal;color:#d9542b;font-weight:800;display:block;font-size:7.5pt}
.k-bingo{padding:10mm 14mm 0}
.k-bingo .card{margin-bottom:5mm}
.k-bingo .hd{background:#11806F;color:#fff;border-radius:3mm 3mm 0 0;padding:2.5mm 4mm;display:flex;justify-content:space-between;align-items:baseline}
.k-bingo .hd b{font-size:15pt}

<script>

  fs: 1, theme: 'auto', sound: true, alertBoth: false, prepAll: false, tab: 'now', sub: 'prep', reh: null, T: null,

/* ---------- 占位替换 ---------- */

}

}

/* ---------- 时间 ---------- */
const pad = n => String(n).padStart(2, '0');
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function nowMs() {

const nowMin = () => nowMs() / 60000;

}
function curSeg(nm) { return SEG.find(s => toMin(s.t0) <= nm && nm < toMin(s.t1)); }
function nextSeg(nm) { return SEG.find(s => toMin(s.t0) > nm); }
const CUES = [];
SEG.forEach(s => ['A', 'B'].forEach(r => (s[r] || []).forEach(b => { if (b.at) CUES.push({ t: toMin(b.at), at: b.at, who: r, text: b.cue || b.t, seg: s.id }); })));
CUES.sort((a, b) => a.t - b.t || (a.who < b.who ? -1 : 1));
const myCues = () => CUES.filter(c => c.who === S.me || S.alertBoth);

/* ---------- 现场进度模式（默认）：不按时钟卡死，跟着现场点「下一环节」，后面的时间和提醒自动顺延 ---------- */
const LIVE = () => S.mode !== 'clock';
function LV() { if (!S.lv) S.lv = { cur: null, start: 0, adj: {}, skip: {}, extra: [], hist: {} }; return S.lv; }
function realMin() { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60 + d.getMilliseconds() / 60000; }
function planDur(s) { return s.extra ? s.min : toMin(s.t1) - toMin(s.t0); }
function segDur(s) { return Math.max(1, planDur(s) + ((LV().adj || {})[s.id] || 0)); }
function segList() {
  if (!LIVE()) return SEG.slice();

}
function fmtMin(m) { m = ((Math.floor(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
// 排期：每段的开始/结束（分钟），当前是第几段
function sched() {
  if (!LIVE()) {
    const nm = nowMin(), list = SEG.map(s => ({ s, a: toMin(s.t0), b: toMin(s.t1) }));
    return { nm, list, cur: isLive() ? list.findIndex(e => e.a <= nm && nm < e.b) : -1, started: isLive() };
  }

    if (i < ci) { const h = L.hist[s.id]; const a = h ? h.a : (s.t0 ? toMin(s.t0) : null), b = h ? h.b : (s.t1 ? toMin(s.t1) : a + segDur(s)); list.push({ s, a, b, done: true }); return; }

}
// 某个提醒点在排期里的实际时间：靠近结尾的按结尾倒推，靠近开头的按开头顺推
function cueAt(e, at) {
  const s = e.s; if (s.extra || !s.t0) return e.a;
  const o0 = toMin(at) - toMin(s.t0), o1 = toMin(s.t1) - toMin(at);
  return o1 <= o0 ? e.b - o1 : e.a + o0;
}
function cuesNow(sc) {
  const out = [], from = Math.max(0, sc.cur);
  sc.list.slice(from).forEach(e => ['A', 'B'].forEach(r => (e.s[r] || []).forEach(b => {
    if (b.at) { const t = cueAt(e, b.at); out.push({ t, at: fmtMin(t), who: r, text: b.cue || b.t, seg: e.s.id }); }

}
function lvGo(id, keepStart) {
  const L = LV(), sc = sched(), nm = realMin();

}

  const nx = sc.list[sc.cur + 1];
  if (!nx) { const L = LV(); L.hist[L.cur] = { a: sc.list[sc.cur].a, b: realMin() }; L.cur = null; L.done = true; save(1); render(); toast('今天的流程全部走完了，辛苦了 🎉', 4000); return; }
  lvGo(nx.s.id); toast('▶ 进入：' + T_(nx.s.title), 2500);
}

}

  const d = Math.round(close.b - toMin('19:00'));

}


/* ---------- 提醒：振动 + 提示音 + 横幅 ---------- */
let AC = null;

/* ---------- 全屏提示牌 ---------- */
let OV = null; // {kind:'sign',t,c} | {kind:'timer'}
function showSign(t, c) { OV = { kind: 'sign', t, c }; drawOV(); buzz(60); }
function drawOV() {

$('#ov').onclick = () => { OV = null; drawOV(); };

/* ---------- 计时器 ---------- */
function T() {
  if (!S.T) S.T = { mode: 'intro', run: false, start: 0, acc: 0, batch: 1, order: {}, cur: {}, bStart: {}, min: 10, flag: 0 };

}

}

  // 跳过的人排到最后

  t.order[b] = sorted; return sorted;
}
function introCur() { const t = T(), o = order(t.batch); const i = o.findIndex(x => x.n === t.cur[t.batch]); return i >= 0 ? o[i].n : (o.find(x => x.st !== 'done') || {}).n || ''; }
function introNext() {
  const t = T(), o = order(t.batch), c = introCur(); const i = o.findIndex(x => x.n === c);
  const rest = o.slice(i + 1).filter(x => x.st !== 'done'); return rest.length ? rest[0].n : '';
}
function timerState() {
  const t = T(), c = tCfg(), e = elapsed(), rem = c.dur - e;

  else if (e >= c.warn) { cls = 'warn'; }

    if (cls === 'bad') { const nx = introNext(); msg = '时间到 → 「' + plain(NEXT_LINE.replace('{next}', nx || '＿＿')) + '」'; msgShort = '时间到'; }
  } else {

    if (cls === 'bad') { msg = '时间到：举「时间到」牌，准备收尾'; msgShort = '时间到'; }

function tReset() { const t = T(); t.run = false; t.acc = 0; t.flag = 0; save(1); render(); }
function tNext() {

  if (o.length && !t.cur[t.batch]) toast('第' + BATCH_LABEL[t.batch] + '批讲完了 🎉<small>' + batchEndHint(t.batch) + '</small>', 8000);

/* ---------- 顶栏 ---------- */

    let at = b.at, t = b.t, label = b.label;

function kindName(k) { return { prep: '准备', host: '主持', speaker: '分享', intro: '自介', free: '交流' }[k] || ''; }

/* ---------- 「现在」 ---------- */
function vNow() {

    '<div style="display:flex;align-items:baseline;gap:8px"><div class="big" id="segrem"' + (rem < 0 ? ' style="color:var(--bad)"' : '') + '>' + (rem >= 0 ? mmss(rem) : '+' + mmss(-rem)) + '</div><span class="muted small" id="segremlab">' + (rem >= 0 ? '本段还剩' : '已超时') + '</span></div><div class="bar"><i id="segbar" style="width:' + pc + '%"></i></div>';

    '</table><div style="margin-top:3mm;font-size:10.5pt">本页合计：签到 ＿＿＿ 人 · 晚餐 ＿＿＿ 人</div></div>'));

  // 8) 主持口袋卡（剪成 4 张，手机没电时用）
  const tl = [['13:00', '开场 · ② 出海地图站队 · 13:08 请雨哥'], ['13:10', '雨哥 40′ · 13:47 举「3 分钟」'], ['13:50', '第①批「三个标签」· 先猜拳夸夸'], ['14:25', '接投影、开 PPT；14:32 Celine 喊回座'], ['14:35', '我的分享 20′（Celine 主持、14:53 举牌）'], ['14:55', '第②批「两真一假」'], ['15:37', '回座提醒'], ['15:40', '嘉宾二 · 15:58 举牌'], ['16:00', '第③批「出海名场面」'], ['16:42', '回座提醒'], ['16:45', '嘉宾三 · 17:03 举牌'], ['17:05', '第④批「Agent 许愿」'], ['17:47', '回座提醒'], ['17:50', '第⑤批「接力回应」'], ['18:45', '自愿合影（喊「出海」）'], ['18:52', '集合提醒'], ['18:55', '结束说明 + 晚餐']];
  const q = (lab, t) => '<div class="q"><i>' + E(lab) + '</i>' + T_(t) + '</div>';
  add('p', 'pocket', '<div class="k-pocket">' +
    '<div class="k-pc"><h3>① 时间线</h3>' + tl.map(r => '<div class="r"><b>' + r[0] + '</b><span>' + E(r[1]) + '</span></div>').join('') + '<div style="margin-top:2mm;color:#777">自介每人 1′：55 秒提示，60 秒接话</div></div>' +
    '<div class="k-pc"><h3>② 五批彩蛋 · 交流小任务</h3>' + [1, 2, 3, 4, 5].map(n => '<div style="margin:1.3mm 0"><b style="color:' + BATCH_COLOR[n] + '">' + BATCH_LABEL[n] + '「' + E(ICE[n].name) + '」</b>' + E(ICE[n].rule.split('。')[0].replace(/([^？！])$/, '$1。')) + '<br><span style="color:#555">交流：' + E(TASKS[n]) + '</span></div>').join('') + '</div>' +
    '<div class="k-pc"><h3>③ 常用的几句话</h3>' + q('回座提醒', RECALL) + q('到时接话', NEXT_LINE.replace('{next}', '＿＿')) + q('记忆快问', QUIZ) + q('问答冷场', '我先抛砖一个：您刚才讲的【某一点】，如果是刚入行的新人，第一步应该做什么？') + q('问答收不住', '最后一个问题，其他的留到交流时间。') + q('不想玩彩蛋', '没关系，彩蛋是加分题，正常介绍就很好！') + '</div>' +
    '<div class="k-pc"><h3>④ 突发情况</h3>' + q('设备故障', EMG.find(e => e.t.startsWith('话筒')).say) + q('嘉宾迟到', '下一位嘉宾正在路上，我们把交流时间延长几分钟，到点我会提醒大家。') + '<div style="color:#555;margin:-.5mm 0 1mm">先和雨哥确认；保住每人 1 分钟和嘉宾时长，压后面的交流段。</div>' +
      q('叫到的人不在', '＿＿ 可能暂时不在，我们先请下一位，TA 回来后再补上。') + q('站队乱 / 挪不动', '大家原地不动也行，我们改成举手——在做东南亚的朋友请举手！') + q('有人争执或不适', '我们稍微暂停一下，大家先和邻座聊几句，马上继续。（通知雨哥）') +
      '<div style="margin-top:2mm">' + E(S.names.B) + ' 电话：＿＿＿＿＿＿　场地联系人：＿＿＿＿＿＿</div></div>' +
    '</div><div style="position:absolute;top:2mm;left:0;right:0;text-align:center;font-size:7.5pt;color:#9aa0b0">主持口袋卡 · 沿虚线剪成 4 张（A6）· 手机没电时用</div>');

  // 9) 宾果卡（可选）
  const bcard = '<div class="card"><div class="hd"><b>人脉宾果 · ' + E(EVENT.title) + '</b><span style="font-size:9pt">我的称呼：＿＿＿＿＿＿</span></div><div class="rule">交流时间里，找到符合格子的人，请 TA 在格子里签名（一人只签一格）。连成一条线（横 / 竖 / 斜）就去找 ' + E(S.names.B) + ' 登记，合影时站前排！</div><div class="grid">' + BINGO.map(b => '<div>' + E(b) + '<span>签名：</span></div>').join('') + '</div></div>';
  add('p', 'bingo', '<div class="k-bingo">' + bcard + '<div style="border-top:.3mm dashed #b9bdc8;margin:0 0 5mm"></div>' + bcard + '</div>');

  // 封面
  const META = [
    ['region', '出海地图区域牌（6 张）', '各 1 份', '13:00 开场站队，布场时按方位贴墙'],
    ['poster', '自介玩法海报', '2 份', '签到台一张、话筒位一张'],
    ['tent', '一分钟自介台卡', '1 份', '沿虚线对折，立在话筒旁'],
    ['tags', '名牌：①–⑤ 批各一种颜色 + 1 页空白', '各 1 份（共 60 张）', '剪开后按批次分好；签到时按批次发。人数超过 50 就多印空白页'],
    ['signs', '提示牌（8 张）', '各 1 份', '举给讲者看：3 分钟 / 2 分钟 / 5 秒 / 时间到 / 回座等（手机提示牌的纸质备份）'],
    ['way', '指路牌（签到处 / 茶点区 / 合影区 / 晚餐集合点 / 箭头）', '各 1 份，箭头 2 份', '箭头那张可以转着贴，指向会场'],
    ['sheet', '签到表（50 行）', '1 份', '签到台用：批次、名牌、晚餐、付款打勾'],
    ['pocket', '主持口袋卡（剪成 4 张）', '1 份', '手机没电时的备份'],
    ['bingo', '人脉宾果卡（一页两张）', '25 份（可选）', '雨哥同意再印；签到时发'],
  ];
  const range = sec => { const idx = pages.map((p, i) => p.sec === sec ? i + 2 : 0).filter(Boolean); return idx.length > 1 ? idx[0] + '–' + idx[idx.length - 1] : String(idx[0]); };
  const cover = '<div class="k-head"><div class="k-h1">沙龙物料包 · 彩色打印版</div><div class="k-sub">' + E(EVENT.title) + ' · 2026 年 11 月 7 日 周六 · 深圳 · 共 ' + (pages.length + 1) + ' 页</div>' +
    '<div class="k-note"><b>打印设置：</b>A4 · <b>彩色</b> · 单面 · 缩放选<b>「实际大小 / 100%」</b>（不要选「适合页面」，否则名牌尺寸会变）。横版页面打印机会自动转向。<br><b>封面这页不用印。</b>需要剪的：名牌、主持口袋卡，沿虚线剪。</div>' +
    '<table class="k-tbl"><tr><th style="width:15mm">页码</th><th>物料</th><th style="width:30mm">印几份</th><th>用在哪</th></tr>' + META.map(m => '<tr><td><b>' + range(m[0]) + '</b></td><td><b>' + E(m[1]) + '</b></td><td>' + E(m[2]) + '</td><td>' + E(m[3]) + '</td></tr>').join('') + '</table>' +
    '<div class="k-note" style="background:#e3f3ef"><b style="color:#11806f">只有这几处要手写：</b>名牌上本人写称呼 / 方向 / 想聊的话题；签到表打勾；宾果卡互相签名；口袋卡上 ' + E(S.names.B) + ' 和场地联系人的电话。</div>' +
    '<div class="k-note" style="background:#f3efe5"><b style="color:#1d2333">还要带：</b>胶带（贴区域牌、指路牌、海报）、几支笔（大家写名牌）、名片卡套（可选，有的话名牌直接插进去）。打印属于新增采购，先跟雨哥说一声。</div>' +
    '<div class="k-sub" style="margin-top:5mm">拿到参加者名单后，可以把名字和批次直接印在名牌和签到表上：把手卡 App「资料 → 同步」的同步码发给 Claude 即可。</div></div>';
  $('#main').innerHTML = '<div class="kp">' + cover + '</div>' + pages.map(p => '<div class="' + (p.o === 'l' ? 'kl' : 'kp') + '">' + p.html + '</div>').join('');
}

/* ---------- 启动 ---------- */
if (PRINT === 'kit') kitDoc();
else if (PRINT) printDoc(PRINT);
else { render(); keepAwake(); setInterval(tick, 250); if (S.T && S.T.run) tSub = 'timer'; }
if (!PRINT && 'serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(() => {}); }

</script>
</body>
